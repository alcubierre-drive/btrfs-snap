#[root hdd]
#watch = hdd
#host_name = cygnus
#backup_dir = /
#backup_name = root
#snapshot_dir = /.snapshots/
#remote_snapshot_dir = /mnt/backup-hdd/snapshots/
#transfer = true
#create = true
#keep_snapshots_num = 10
#keep_remote_snapshots_num = 3
