<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- btrfs-snap-cpp daemon: only root may own the name, everybody may call it;
     mutating methods are authorized by the daemon via polkit -->
<busconfig>
  <policy user="root">
    <allow own="org.btrfssnapcpp.Daemon1"/>
    <allow send_destination="org.btrfssnapcpp.Daemon1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.btrfssnapcpp.Daemon1"/>
  </policy>
</busconfig>
